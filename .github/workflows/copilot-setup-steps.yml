# Ephemeral environment setup for the Copilot Coding Agent (Cloud Agent).
#
# GitHub reads this workflow BEFORE the agent starts working. The single job
# named `copilot-setup-steps` runs to prepare the environment (install
# dependencies, cache, etc.). Do not rename the job.
#
# Docs: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
name: Copilot Setup Steps

on:
  workflow_dispatch: {}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sample-app/requirements.txt

      - name: Install sample-app dependencies
        working-directory: sample-app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check — collect tests
        working-directory: sample-app
        run: pytest --collect-only -q
